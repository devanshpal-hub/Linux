# Use lowercase yes/no values.
DOCKER_INSTALL=yes
UPDATE_SYSTEM=yes
ENABLE_FIREWALL=no
ENABLE_LOGGING=yes
NEW_USER=no

# User settings are used when NEW_USER=yes. New users are created without a
# password; configure a password or SSH keys separately.
NEW_USERNAME=""
NEW_USER_SUDO=no
NEW_USER_DOCKER_ACCESS=no
NEW_USER_GROUPS=""

# UFW allows the SSH TCP port below and each additional comma-separated rule.
FIREWALL_SSH_PORT=22
FIREWALL_ALLOWED_PORTS="80/tcp,443/tcp"

# Comma-separated package names installed from Ubuntu's repositories.
PACKAGES="git,curl,wget"

LOG_FILE="/var/log/linux-server-automation.log"
